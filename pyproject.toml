[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mevzuat-mcp"
version = "1.8.0"
description = "Remote MCP for Turkish legislation and live Ministry of Trade laws, supports, data, reports and overseas contacts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Said Surucu", email = "saidsrc@gmail.com"}
]
keywords = ["mcp", "mevzuat", "turkish-law", "legislation", "chatgpt", "codex", "ticaret", "gumruk", "ithalat", "ihracat", "devlet-destekleri"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "fastmcp>=3.4.7,<4",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "markitdown[docx,pdf,xls]==0.1.3",
    "openpyxl==3.1.5",
    "olefile==0.47",
    "playwright==1.55.0",
    "mistralai>=1.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "Pillow>=10.4.0",
    "stripe>=13.0.0",
    "pymupdf>=1.28.2",
]

[project.urls]
"Homepage" = "https://github.com/hiktan44/mevzuat-mcp"
"Bug Tracker" = "https://github.com/hiktan44/mevzuat-mcp/issues"
"Repository" = "https://github.com/hiktan44/mevzuat-mcp"

[project.scripts]
mevzuat-mcp = "mevzuat_mcp_server:main"

[tool.setuptools]
py-modules = ["mevzuat_mcp_server", "app", "unified_search", "countries", "bulk_costing", "origin_documents", "email_service", "exchange_rates", "trade_measures", "tax_lists", "eylemio_client", "mevzuat_client", "mevzuat_models", "article_search", "bedesten_client", "bedesten_models", "ticaret_client", "ticaret_models", "customs_advisor", "tariff_engine", "control_engine", "classification_evidence", "customs_benchmark", "trusted_certificates", "auth_service", "account_service", "billing_service", "security_firewall", "product_page", "shipping_documents", "hybrid_index", "hybrid_corpora"]
packages = ["semantic_search"]

[tool.setuptools.data-files]
"." = ["ticaret_sources.json", "customs_sources.json", "tariff_sources.json", "control_sources.json"]
"data/official" = [
    "data/official/antidumping_measures.json",
    "data/official/safeguard_measures.json",
    "data/official/surveillance_measures.json",
    "data/official/agricultural_quotas.json",
    "data/official/import_communiques.json",
    "data/official/excise_tax_lists.json",
]
"benchmarks" = [
    "benchmarks/customs_classification_v1.jsonl",
    "benchmarks/turkish_btb_gtip12_historical_v1.jsonl",
]
